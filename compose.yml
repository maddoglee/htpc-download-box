services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8000:8000  # Control panel
      - 8080:8080  # qBittorrent
      - 9696:9696  # Prowlarr
      - 8191:8191 # flaresolverr
      - 7474:7474 # autobrr
      - 5030:5030  # Slskd Web UI
      - 5031:5031  # slskd Port 5031
      - 50300:50300 # slskd Listening Port
    #  - 9191:9191 # dispatcharr
    #  - 34400:34400 # threadfin
    dns:
      - 9.9.9.9 # Quad9
    #  - 192.168.1.21 # Your AdGuard IP 
      - 1.1.1.1 # Fallback to Cloudflare
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    volumes:
      - ./config/gluetun:/gluetun
    environment:
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTONPRIVATE}
      - SERVER_COUNTRIES=Australia
      - SERVER_CITIES=Sydney
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - HEALTH_TARGET_ADDRESS=google.com:443 # Fix healthcheck
    #  - HEALTHCHECK_VPN=on
      - FIREWALL=off
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24
    #  - FIREWALL_INPUT_PORTS=56789
      - VPN_DISABLE_IPV6=true
      - TZ=${TZ}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -s http://localhost:8000/v1/openvpn/portforwarded | grep -q '\"port\":0' && exit 1 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  #gluetun-watchdog:
  #  image: alpine
  #  container_name: gluetun-watchdog
  #  volumes:
  #    - /var/run/docker.sock:/var/run/docker.sock
  #    - ./gluetun_watchdog.sh:/gluetun_watchdog.sh
  #  entrypoint: sh /gluetun_watchdog.sh
  #  depends_on:
  #    gluetun:
  #      condition: service_healthy

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: always
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - ${LOCAL_DATA}/torrents:/torrents # Make sure this isn't a network connected folder. Torrents seem to get lots of errors.

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: always
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr:/config
  
  autobrr:
    container_name: autobrr
    image: ghcr.io/autobrr/autobrr:latest
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    #logging:
    #  driver: json-file
    #  options:
    #    max-file: ${DOCKERLOGGING_MAXFILE}
    #    max-size: ${DOCKERLOGGING_MAXSIZE}
    user: 1000:1000
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/autobrr:/config
  
  sonarr:
    container_name: sonarr
    image: linuxserver/sonarr:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/sonarr:/config
      - ${DATA}:/data
      - ${LOCAL_DATA}/torrents:/torrents
  
  radarr:
    container_name: radarr
    image: linuxserver/radarr:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/radarr:/config
      - ${DATA}:/data
      - ${LOCAL_DATA}/torrents:/torrents

  bazarr:
    container_name: bazarr
    image: linuxserver/bazarr:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK_SET=022
    volumes:
      - ./config/bazarr:/config
      - ${DATA}/media:/data/media

  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    restart: unless-stopped
    network_mode: host
    environment:
      - LOG_LEVEL=debug
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PORT=5055
    volumes:
      - ./config/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
  
  profilarr:
    image: santiagosayshey/profilarr:latest
    container_name: profilarr
    ports:
      - "6868:6868"
    volumes:
      - ./config/profilarr:/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    restart: unless-stopped

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: unless-stopped
    ports:
      - "11011:11011"
    volumes:
      - ./config/cleanuparr:/config
    environment:
      - PORT=11011
      - BASE_PATH=
      - UMASK=022
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}


  droppedneedle:
    image: droppedneedle/droppedneedle:latest
    container_name: droppedneedle
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PORT=8688
      - SLSKD_DOWNLOADS_PATH=/slskd-downloads
    ports:
      - "8688:8688"
    volumes:
      - ./config/droppedneedle:/app/config
      - ./cache/droppedneedle:/app/cache
      - ${DATA}/media/music:/music:rw                # Maps to /mnt/storage/data/media/music
      - ${LOCAL_DATA}/torrents/slskd/downloads:/slskd-downloads:rw # Maps to /mnt/storage/data/torrents/slskd/downloads
    restart: unless-stopped

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    restart: always
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SLSKD_REMOTE_CONFIGURATION=true
      # Crucial: This environment variable sets your slskd API key
      - SLSKD_HTTP_OPTIONS__API_KEY=${SLSKD_API_KEY}
      - SLSKD_SLSK_USERNAME=${SLSK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSK_PASSWORD}
    volumes:
      - ./config/slskd:/app
      - ${LOCAL_DATA}/torrents/slskd/downloads:/app/downloads  # Identical host path to droppedneedle's inbound folder
      - ${DATA}/media/music:/data/music:ro
    
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    ports:
      - "4533:4533"
    environment:
      ND_LOGLEVEL: "info"
      ND_SESSIONTIMEOUT: "24h"
      ND_BASEURL: ""
    volumes:
      - ./config/navidrome:/data
      - ${DATA}/media/music:/music:ro  # Mount music folder as Read-Only
    restart: unless-stopped

  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    restart: unless-stopped
    container_name: dispatcharr
    #network_mode: "service:gluetun"
    #depends_on:
    #  gluetun:
    #    condition: service_healthy
    ports:
      - 9191:9191
    volumes:
      - ./config/dispatcharr:/data
    environment:
      - DISPATCHARR_ENV=aio
      - REDIS_HOST=localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DISPATCHARR_LOG_LEVEL=info
    #  - LIBVA_DRIVER_NAME=iHD   # ensure use of Intel's iHD driver
    
    # Process Optimization (Highly Recommended for smooth streaming)
    #  - UWSGI_NICE_LEVEL=-5  # Gives higher priority to uWSGI/Streaming
    #  - CELERY_NICE_LEVEL=5   # Lowers priority for heavy EPG sync tasks
    #cap_add:
    #  - SYS_NICE                # Required to allow UWSGI_NICE_LEVEL to go below 0
    # Optional for hardware acceleration
    #devices:
    #  - /dev/dri:/dev/dri  # For Intel/AMD GPU acceleration (VA-API)
